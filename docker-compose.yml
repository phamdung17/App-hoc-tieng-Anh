# docker-compose.yml — Dev environment cho English AI Backend
# Không có container YOLO-World — AI scan qua Gemini API (external HTTP call)
#
# Sử dụng:
#   Copy-Item backend_app/backend/.env.example backend_app/backend/.env
#   docker compose up -d
#   docker compose logs -f backend

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend_app/backend
      dockerfile: Dockerfile
    container_name: english_ai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend_app/backend/.env
    environment:
      # Override DATABASE_URL để trỏ vào service postgres (hostname = "postgres")
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/english_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend_app/backend:/app   # Hot reload trong dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: english_ai_postgres
    environment:
      POSTGRES_DB: english_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: english_ai_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── ARQ Worker (background jobs) ──────────────────────────────────────
  # Uncomment sau khi có workers/main.py
  # worker:
  #   build:
  #     context: ./backend_app/backend
  #     dockerfile: Dockerfile
  #   container_name: english_ai_worker
  #   env_file:
  #     - ./backend_app/backend/.env
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/english_ai
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on: [postgres, redis, backend]
  #   command: arq app.workers.main.WorkerSettings
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local

# NOTE: Không có container yolo-world.
# AI scan dùng Google Gemini API qua internet — chỉ cần GEMINI_API_KEY trong .env.
