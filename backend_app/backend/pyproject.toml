[tool.poetry]
name = "english-ai-backend"
version = "0.1.0"
description = "Backend cho App học tiếng Anh + AI (FastAPI + Gemini)"
authors = ["Dev Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = { extras = ["email"], version = "^2.9" }
pydantic-settings = "^2.5"
httpx = "^0.27"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.13"
redis = { extras = ["hiredis"], version = "^5.1" }
arq = "^0.26"
pillow = "^11.0"
python-multipart = "^0.0.12"
python-jose = { extras = ["cryptography"], version = "^3.3" }
passlib = { extras = ["bcrypt"], version = "^1.7" }
boto3 = "^1.35"          # S3/R2 storage client
resend = "^2.4"          # Email via Resend
firebase-admin = "^6.5"  # FCM push notifications

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
httpx = "^0.27"           # Đã có trên nhưng cần cho TestClient
anyio = { extras = ["trio"], version = "^4.6" }
faker = "^30.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
